<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>My Canva Style App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      height: 100vh;
      color: #333;
    }

    /* Sidebar trái */
    .sidebar {
      width: 220px;
      background: #f4f4f4;
      padding: 20px;
      border-right: 1px solid #ddd;
    }

    .sidebar h2 {
      margin-bottom: 20px;
      font-size: 20px;
      color: #555;
    }

    .sidebar button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }

    .sidebar button:hover {
      background: #e0e0e0;
    }

    /* Khu vực nội dung */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 15px 20px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .content {
      padding: 20px;
      background: #fafafa;
      flex: 1;
      overflow-y: auto;
    }

    .logo {
      font-weight: bold;
      font-size: 18px;
      color: #0073e6;
    }

    .search {
      flex: 1;
      margin: 0 20px;
    }

    .search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>📁 Menu</h2>
    <button onclick="setContent('Trang chủ')">🏠 Trang chủ</button>
    <button onclick="setContent('Hình của Anh')">🧔‍♂️ Hình của Anh</button>
    <button onclick="setContent('Hình của Em')">💃 Hình của Em</button>
    <button onclick="setContent('Năm 2025')">📆 2025</button>
    <button onclick="setContent('Góc chát')">💌 Góc chát</button>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="logo">MyLove ❤️</div>
      <div class="search"><input type="text" placeholder="Tìm gì đó..."></div>
      <div>👤 Anh Hoàng</div>
    </div>

    <div class="content" id="content">
      <h2>Chào mừng em đến với thế giới của tụi mình 🥰</h2>
    </div>
  </div>

  <script>
    function setContent(text) {
      document.getElementById("content").innerHTML = `<h2>${text}</h2><p>Đây là nội dung của mục "${text}" đó nha 💖</p>`;
    }
  </script>
</body>
</html>
