<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>My Canva Style App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <head>
  <meta charset="UTF-8" />
  <title>Trang của em</title>
  <link rel="stylesheet" href="https://hoang96vn.github.io/css/style.css" />
</head>
<div class="header">
  <img src="hoang/logo.png" alt="Logo của chúng ta" class="logo-img">
  <div class="logo-text">My Love Web</div>
</div>
</head>
<body>
 
</div>
    <button onclick="setContent('<a href="https://https://hoang96vn.github.io/hoang/index.html">trang chủ</a>')">🏠 Trang chủ</button>
    <button onclick="setContent('Hình của Anh')">🧔‍♂️ Hình của Anh</button>
    <button onclick="setContent('Hình của Em')">💃 Hình của Em</button>
    <button onclick="setContent('Năm 2025')">📆 2025</button>
    <button onclick="setContent('Góc chát')">💌 Góc chát</button>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="logo">MyLove ❤️</div>
     
      <div>👤 Anh Hoàng</div>
    </div>

    <div class="content" id="content">
      <h2>Chào mừng em đến với thế giới của tụi mình 🥰</h2>
    </div>
  </div>

  <script>
    function setContent(text) {
      document.getElementById("content").innerHTML = `<h2>${text}</h2><p>Đây là nội dung của mục "${text}" đó nha 💖</p>`;
    }
  </script>
</body>
</html>
