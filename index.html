<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>My Canva Style App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
  body {
    font-family: 'Poppins', sans-serif;
    display: flex;
    height: 100vh;
    color: #333;
    background: #F6F9FC;
  }

  .sidebar {
    width: 220px;
    background: #ffffff;
    padding: 20px;
    border-right: 1px solid #ddd;
  }

  .sidebar h2 {
    color: #8C30F5;
    font-size: 18px;
    margin-bottom: 20px;
  }

  .sidebar button {
    background: #E6F6F7;
    color: #00C4CC;
    border: none;
    padding: 10px;
    margin-bottom: 10px;
    width: 100%;
    border-radius: 8px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .sidebar button:hover {
    background: #d0f0f1;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    background: #ffffff;
    padding: 15px 20px;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-size: 20px;
    font-weight: bold;
    color: #8C30F5;
  }

  .search input {
    padding: 8px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    width: 250px;
  }

  .content {
    padding: 30px;
    background: #F6F9FC;
    flex: 1;
    overflow-y: auto;
  }
</style>
</head>
<body>
  <div class="sidebar">
    <h2>📁 Menu</h2>
    <button onclick="setContent('<a href="https://https://hoang96vn.github.io/hoang/index.html">trang chủ</a>')">🏠 Trang chủ</button>
    <button onclick="setContent('Hình của Anh')">🧔‍♂️ Hình của Anh</button>
    <button onclick="setContent('Hình của Em')">💃 Hình của Em</button>
    <button onclick="setContent('Năm 2025')">📆 2025</button>
    <button onclick="setContent('Góc chát')">💌 Góc chát</button>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="logo">MyLove ❤️</div>
      <div class="search"><input type="text" placeholder="Tìm gì đó..."></div>
      <div>👤 Anh Hoàng</div>
    </div>

    <div class="content" id="content">
      <h2>Chào mừng em đến với thế giới của tụi mình 🥰</h2>
    </div>
  </div>

  <script>
    function setContent(text) {
      document.getElementById("content").innerHTML = `<h2>${text}</h2><p>Đây là nội dung của mục "${text}" đó nha 💖</p>`;
    }
  </script>
</body>
</html>
